# Release: push a tag vX.Y.Z (vX.Y.Z-rc.N = pre-release, not tagged `latest`).
#   1. multi-arch images (native amd64 + arm64 runners, merged manifests) -> GHCR:
#        ghcr.io/<owner>/falak-control-plane, falak-builder, falak-edge, falak-fn-bun, falak-fn-node,
#        falak-fn-deno, falak-fn-python, falak-fn-go  :<tag> and :latest
#   2. falak-agent / falak / falak-builder / falak-restore binaries (make build), falak-deploy.tar.gz, install.sh, falak-ctl,
#      SHA256SUMS, SHA256SUMS.sig -> GitHub release assets. The bundle records the image digests (deploy/image-digests).
#   SHA256SUMS.sig: Ed25519 signature by the FALAK_RELEASE_SIGNING_KEY secret (PEM PKCS#8); its public key is
#   agent/internal/cli/release-signing.pub. No secret or no public key = no release.
# Otherwise only GITHUB_TOKEN is used. After the first release, make the GHCR packages public
# (Package settings -> Change visibility) so servers can pull without logging in.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The database images the control plane ships (docs/DB_IMAGES.md, "Trust"): the db-images run of this same tag
  # publishes <version>-<tag> for every engine/version; this job waits for all of them (up to 2 h: it builds, tests and
  # scans first) and pins their index digests into the control-plane image. A missing image fails the release.
  db-digests:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Fail before hours of builds: the release job signs SHA256SUMS with this key.
      - name: Release signing is configured
        env:
          FALAK_RELEASE_SIGNING_KEY: ${{ secrets.FALAK_RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$FALAK_RELEASE_SIGNING_KEY" ] || { echo "::error::the FALAK_RELEASE_SIGNING_KEY secret is not set: refusing an unsigned release"; exit 1; }
          grep -q '^-----BEGIN PUBLIC KEY-----$' agent/internal/cli/release-signing.pub \
            || { echo "::error::agent/internal/cli/release-signing.pub holds no public key"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the database image digests of this tag
        run: tools/db-image-digests.sh "-${GITHUB_REF_NAME}" --wait 7200 --owner "${GITHUB_REPOSITORY_OWNER}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-image-digests
          path: control-plane/modules/Databases/config/db-image-digests.json
          if-no-files-found: error
          retention-days: 1

  images:
    name: image ${{ matrix.image }} (${{ matrix.arch }})
    needs: db-digests
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [control-plane, builder, edge, fn-bun, fn-node, fn-deno, fn-python, fn-go]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: control-plane
            dockerfile: control-plane/Dockerfile
            context: .
          - image: builder
            dockerfile: deploy/builder.Dockerfile
            context: .
          - image: edge
            dockerfile: deploy/edge/Dockerfile
            context: deploy/edge
          # Function runtimes (runtimes/functions/<runtime>/README.md); servers pull them for functions. The context
          # is runtimes/functions: the JS runtimes share shared/ (tracer, entry loader, scheduled runs).
          - image: fn-bun
            dockerfile: runtimes/functions/bun/Dockerfile
            context: runtimes/functions
          - image: fn-node
            dockerfile: runtimes/functions/node/Dockerfile
            context: runtimes/functions
          - image: fn-deno
            dockerfile: runtimes/functions/deno/Dockerfile
            context: runtimes/functions
          - image: fn-python
            dockerfile: runtimes/functions/python/Dockerfile
            context: runtimes/functions
          - image: fn-go
            dockerfile: runtimes/functions/go/Dockerfile
            context: runtimes/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pinned database images
        if: matrix.image == 'control-plane'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: db-image-digests
          path: control-plane/modules/Databases/config

      - name: Check the pinned database images
        if: matrix.image == 'control-plane'
        run: jq -e '[.[] | .[]] | length > 0 and all(test("^sha256:[0-9a-f]{64}$"))' control-plane/modules/Databases/config/db-image-digests.json

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/falak-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          build-args: FALAK_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    name: manifest ${{ matrix.image }}
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [control-plane, builder, edge, fn-bun, fn-node, fn-deno, fn-python, fn-go]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest (<tag>, and latest for final releases)
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/falak-${{ matrix.image }}"
          tags=(-t "$image:${GITHUB_REF_NAME}")
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$image:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}"
          mkdir -p /tmp/image-digest
          digest="$(docker buildx imagetools inspect "$image:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "falak-${{ matrix.image }} $digest" > "/tmp/image-digest/falak-${{ matrix.image }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.image }}
          path: /tmp/image-digest/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub release
    needs: manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build binaries
        working-directory: agent
        run: make build VERSION="${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/image-digest
          pattern: image-digest-*
          merge-multiple: true

      - name: Assemble assets
        run: |
          cat /tmp/image-digest/falak-* > /tmp/image-digests
          [ "$(grep -cE '^falak-[a-z-]+ sha256:[0-9a-f]{64}$' /tmp/image-digests)" = 8 ] || { cat /tmp/image-digests; exit 1; }
          FALAK_IMAGE_DIGESTS=/tmp/image-digests deploy/tools/release-assets.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" dist

      - name: Sign SHA256SUMS
        env:
          FALAK_RELEASE_SIGNING_KEY: ${{ secrets.FALAK_RELEASE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/release-signing.key"
          (umask 077 && printf '%s\n' "$FALAK_RELEASE_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -rawin -inkey "$key" -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$key"
          # The key pair matches what install.sh, falak-ctl, install-cli.sh and `falak update` check against.
          openssl pkeyutl -verify -rawin -pubin -inkey agent/internal/cli/release-signing.pub -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Falak $GITHUB_REF_NAME" "${prerelease[@]}"
