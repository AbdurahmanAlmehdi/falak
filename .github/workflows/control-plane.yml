name: control-plane

on:
  push:
    branches: [main, "release/**"]
    paths: ['control-plane/**', 'contracts/**', 'tools/**', 'templates.lock', '.github/workflows/control-plane.yml']
  pull_request:
    branches: [main, "release/**"]
    paths: ['control-plane/**', 'contracts/**', 'tools/**', 'templates.lock', '.github/workflows/control-plane.yml']

defaults:
  run:
    working-directory: control-plane

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          bun install --frozen-lockfile

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Tests (unit, feature, architecture)
        run: ./vendor/bin/pest

      # A panel change must not reject a template already published (github.com/falak-sh/templates): the catalog
      # pinned in templates.lock (baked into the image) and the latest release both pass this code's checks.
      - name: Published template catalogs pass this panel's checks
        env:
          CACHE_STORE: array
          FALAK_TEMPLATES_URL: ''
        run: |
          ../tools/fetch-templates.sh /tmp/catalog-pinned
          mkdir -p /tmp/catalog-latest
          curl -fsSL https://github.com/falak-sh/templates/releases/latest/download/catalog.tar.gz | tar -xz -C /tmp/catalog-latest
          failed=0
          for dir in /tmp/catalog-pinned/*/ /tmp/catalog-latest/*/; do
            php artisan templates:render "$dir" > /dev/null || { echo "::error::${dir} fails this panel's template checks"; failed=1; }
          done
          exit "$failed"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # No Xdebug: with it Pint alone took ~11 minutes.
          coverage: none

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          composer install -q --no-interaction --no-scripts --no-progress --prefer-dist
          bun install --frozen-lockfile

      - name: Pint
        run: vendor/bin/pint --test --parallel

      - name: Prettier
        run: bun run format:check

      - name: ESLint
        run: bun run lint:check

      - name: TypeScript
        run: bun run types

      - name: Vitest
        run: bun run test
        env:
          # laravel-vite-plugin refuses to start under CI=true; Vitest only uses it to load the config.
          LARAVEL_BYPASS_ENV_CHECK: '1'

      - name: Build
        run: bun run build
