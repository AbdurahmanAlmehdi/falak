name: packages

on:
  push:
    branches: [main]
    paths: ['packages/**', '.github/workflows/packages.yml']
  pull_request:
    branches: [main]
    paths: ['packages/**', '.github/workflows/packages.yml']

jobs:
  apm-laravel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        laravel: ['^12.0', '^13.0']
    defaults:
      run:
        working-directory: packages/apm-laravel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install (Laravel ${{ matrix.laravel }})
        run: composer update --no-interaction --prefer-dist -W --with "illuminate/support:${{ matrix.laravel }}"

      - name: Test
        run: vendor/bin/pest

  apm-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/apm-node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
