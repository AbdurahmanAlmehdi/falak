name: brand

# Every push and PR, whatever it touches: no file may bring back the product's previous name.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Brand check
        run: tools/check-brand.sh
