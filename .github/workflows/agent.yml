name: agent

on:
  push:
    branches: [main, "release/**"]
    paths: ['agent/**', 'contracts/**', 'runtimes/**', '.github/workflows/agent.yml']
  pull_request:
    branches: [main, "release/**"]
    paths: ['agent/**', 'contracts/**', 'runtimes/**', '.github/workflows/agent.yml']

defaults:
  run:
    working-directory: agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build (static, all targets)
        run: make build

      - name: falak-db packages match db-images.yml paths
        # db-images.yml only rebuilds the database images when these packages change; a new import must be added there.
        run: |
          got=$(go list -deps ./cmd/falak-db | sed -n "s|^$(go list -m)/||p" | sort | tr '\n' ' ')
          test "$got" = "cmd/falak-db internal/dbhelper internal/sqlnorm internal/version " || { echo "falak-db now uses: $got — update the agent paths in db-images.yml and this list"; exit 1; }

  # Function runtimes: their own logic (telemetry URL redaction, the Python and Go installers). The gateway's
  # redaction test above reads the same cases (runtimes/functions/tests/redact-cases.json).
  runtimes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27'

      - name: JS (shared tracer)
        run: node --test tests/redact.test.mjs

      - name: Python
        run: PYTHONPATH=python python -m unittest discover -s tests

      - name: Go runtime and installer
        run: |
          test -z "$(gofmt -l go)" || (gofmt -l go && exit 1)
          (cd go/runtime && go vet . && go test ./...)
          (cd go/install && go vet ./... && go test ./...)
