# PR/main CI for the production install: build the images (amd64, no push), lint the scripts and
# validate the compose file. Only the parts a change touches run (`changes` below); tags rebuild
# everything in release.yml.
name: images

on:
  push:
    branches: [main]
    paths: ['control-plane/**', 'agent/**', 'contracts/**', 'deploy/**', 'observability/**', 'runtimes/**', 'templates.lock', 'tools/**', '.github/workflows/images.yml']
  pull_request:
    branches: [main]
    paths: ['control-plane/**', 'agent/**', 'contracts/**', 'deploy/**', 'observability/**', 'runtimes/**', 'templates.lock', 'tools/**', '.github/workflows/images.yml']

permissions:
  contents: read

jobs:
  # Which groups below the change touches. Each filter lists what that image COPYs (see its Dockerfile).
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      groups: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            lint:
              - 'deploy/**'
              - 'observability/**'
              - 'tools/check-brand.sh'
              - 'tools/db-image-digests.sh'
              - '.github/workflows/images.yml'
            control-plane:
              - 'control-plane/**'
              - 'agent/**'
              - 'contracts/**'
              - 'templates.lock'
              - 'observability/grafana/dashboards/**'
              - 'deploy/control-plane/**'
              - '.github/workflows/images.yml'
            builder:
              - 'agent/**'
              - 'deploy/builder.Dockerfile'
              - 'deploy/builder/**'
              - '.github/workflows/images.yml'
            edge:
              - 'deploy/edge/**'
              - '.github/workflows/images.yml'
            functions:
              - 'runtimes/functions/**'
              - '.github/workflows/images.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck deploy/install.sh deploy/falak-ctl deploy/tools/*.sh deploy/tests/*.sh deploy/control-plane/*.sh deploy/edge/entrypoint.sh deploy/builder/entrypoint.sh tools/check-brand.sh tools/db-image-digests.sh
      - name: falak-ctl tests
        # As root, like falak-ctl on a server: drift detection reads containers' mount namespaces via /proc.
        run: for t in deploy/tests/*.sh; do sudo -E bash "$t"; done
      - name: compose config
        run: |
          deploy/tools/test-env.sh > /tmp/falak.env
          docker compose -p falak --env-file /tmp/falak.env -f deploy/compose.yml config -q
          COMPOSE_PROFILES=observability docker compose -p falak --env-file /tmp/falak.env -f deploy/compose.yml config -q
      - name: edge Caddyfile
        # The edge's own Caddy build: the Caddyfile uses modules stock Caddy lacks (rate_limit). Own DOCKER_CONFIG:
        # the deploy tests above leave ~/.docker root-owned.
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-edge-lint"
          docker build -q -t falak-edge-lint deploy/edge >/dev/null
          docker run --rm --entrypoint sh -e FALAK_DOMAIN=falak.example.com -e FALAK_ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/edge/Caddyfile:/etc/caddy/Caddyfile:ro" falak-edge-lint \
            -c 'mkdir -p /etc/caddy/global /etc/caddy/sites && caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'

  build:
    name: build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: control-plane
            group: control-plane
            dockerfile: control-plane/Dockerfile
            context: .
          - image: builder
            group: builder
            dockerfile: deploy/builder.Dockerfile
            context: .
          - image: edge
            group: edge
            dockerfile: deploy/edge/Dockerfile
            context: deploy/edge
          - image: fn-bun
            group: functions
            dockerfile: runtimes/functions/bun/Dockerfile
            context: runtimes/functions
          - image: fn-node
            group: functions
            dockerfile: runtimes/functions/node/Dockerfile
            context: runtimes/functions
          - image: fn-deno
            group: functions
            dockerfile: runtimes/functions/deno/Dockerfile
            context: runtimes/functions
          - image: fn-python
            group: functions
            dockerfile: runtimes/functions/python/Dockerfile
            context: runtimes/functions
          - image: fn-go
            group: functions
            dockerfile: runtimes/functions/go/Dockerfile
            context: runtimes/functions
    # ponytail: step-level skip (a job `if` can't read the matrix); an untouched image costs a few idle seconds.
    env:
      BUILD: ${{ contains(fromJSON(needs.changes.outputs.groups), matrix.group) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.BUILD == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.BUILD == 'true'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: env.BUILD == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: FALAK_VERSION=ci-${{ github.sha }}
          push: false
          load: ${{ matrix.image == 'control-plane' }}
          tags: falak-ci/falak-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
      - name: Smoke-test the control-plane image
        if: env.BUILD == 'true' && matrix.image == 'control-plane'
        run: |
          docker run --rm --entrypoint sh falak-ci/falak-control-plane:ci -c '
            set -e
            id -un | grep -qx www-data
            for f in falak-agent-linux-amd64 falak-agent-linux-arm64 falak-builder-linux-amd64 falak-builder-linux-arm64 falak-linux-amd64 falak-linux-arm64 falak-caddy-linux-amd64 falak-caddy-linux-arm64; do
              test -x /opt/falak/bin/$f; (cd /opt/falak/bin && sha256sum -c $f.sha256 >/dev/null)
            done
            # The Falak Caddy build (edge rate limits): the modules the agent requires.
            /opt/falak/bin/falak-caddy-linux-amd64 list-modules | grep -qx http.handlers.rate_limit
            /opt/falak/bin/falak-caddy-linux-amd64 list-modules | grep -qx dns.providers.cloudflare
            test -d /opt/falak/contracts/agent-protocol
            php -m | grep -q pdo_pgsql
            php --ini | grep -q "Loaded Configuration File: *.*/php-cli.ini"
            test -f /app/public/frankenphp-worker.php
            for mode in worker classic; do
              FALAK_PHP_SERVER=$mode FALAK_PHP_WORKERS=2 FALAK_FRANKENPHP_THREADS="num_threads 4" \
                frankenphp adapt --config /etc/frankenphp/Caddyfile >/dev/null
            done
            APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= php artisan --version'
