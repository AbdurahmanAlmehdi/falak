# Written by `falak init` from the code (comments say why). Check it, then commit it.
# Schema and docs: https://falak.sh/schema/v1.json
$schema: https://falak.sh/schema/v1.json
version: 1

units:
  web:
    type: app
    runtime: frankenphp # detected: composer.json
    framework: laravel # detected: laravel/framework ^12.0 in composer.json
    php: "8.4" # detected: php ^8.4 in composer.json
    deploy:
      hooks:
        before_activate: | # detected: database/migrations (Falak's Laravel deploy steps, migrations on the leader)
          if [ "$FALAK_IS_LEADER" = "1" ]; then
            $FALAK_PHP artisan migrate --force
          fi
          $FALAK_PHP artisan optimize
          $FALAK_PHP artisan storage:link --force
    env: # from the example env file; secrets are ${{ secrets.NAME }} references
      APP_NAME: Lina
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: ${{ db.DB_CONNECTION }}
      DB_HOST: ${{ db.DB_HOST }}
      DB_PORT: ${{ db.DB_PORT }}
      DB_DATABASE: ${{ db.DB_DATABASE }}
      DB_USERNAME: ${{ db.DB_USERNAME }}
      DB_PASSWORD: ${{ db.DB_PASSWORD }}
      MAIL_MAILER: smtp
      MAIL_PORT: "1025"

  db:
    type: database
    engine: mysql # detected: DB_CONNECTION=mysql in .env.example

# No environments: the project's production environment deploys from the repository's default branch.
# To bind branches, name the project's environment slugs (a push to production's branch creates the others):
# environments:
#   production:
#     branch: main
#   staging:
#     branch: develop
