# Written by `falak init` from the code (comments say why). Check it, then commit it.
# Schema and docs: https://falak.sh/schema/v1.json
$schema: https://falak.sh/schema/v1.json
version: 1

units:
  web:
    type: app
    runtime: docker # detected: Dockerfile
    port: 8000 # detected: EXPOSE 8000 in Dockerfile
    build:
      mode: docker # detected: Dockerfile
    health_path: /up # detected: health route in bootstrap/app.php
    env: # from the example env file; secrets are ${{ secrets.NAME }} references
      APP_NAME: Blog
      APP_ENV: production
      APP_KEY: ${{ secrets.APP_KEY }} # required: create it from `php artisan key:generate --show` (Falak generates it only for native Laravel units)
      APP_DEBUG: "false"
      DB_CONNECTION: ${{ db.DB_CONNECTION }}
      DB_HOST: ${{ db.DB_HOST }}
      DB_PORT: ${{ db.DB_PORT }}
      DB_DATABASE: ${{ db.DB_DATABASE }}
      DB_USERNAME: ${{ db.DB_USERNAME }}
      DB_PASSWORD: ${{ db.DB_PASSWORD }}
      QUEUE_CONNECTION: database

  db:
    type: database
    engine: postgresql # detected: DB_CONNECTION=pgsql in .env.example

# No environments: the project's production environment deploys from the repository's default branch.
# To bind branches, name the project's environment slugs (a push to production's branch creates the others):
# environments:
#   production:
#     branch: main
#   staging:
#     branch: develop
