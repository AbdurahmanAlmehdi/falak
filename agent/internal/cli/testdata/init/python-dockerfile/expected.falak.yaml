# Written by `falak init` from the code (comments say why). Check it, then commit it.
# Schema and docs: https://falak.sh/schema/v1.json
$schema: https://falak.sh/schema/v1.json
version: 1

units:
  web:
    type: app
    runtime: docker # detected: python (requirements.txt); starter Dockerfile written by falak init
    port: 8000 # EXPOSE 8000 in the starter Dockerfile
    build:
      mode: docker
    env:
      DATABASE_URL: ${{ db.DATABASE_URL }} # detected: psycopg in the Python requirements

  db:
    type: database
    engine: postgresql # detected: psycopg in the Python requirements

# No environments: the project's production environment deploys from the repository's default branch.
# To bind branches, name the project's environment slugs (a push to production's branch creates the others):
# environments:
#   production:
#     branch: main
#   staging:
#     branch: develop
