$schema: https://falak.sh/schema/v1.json
version: 1

units:
  api:
    type: app
    root: apps/api
    runtime: docker # detected: go (go.mod); starter Dockerfile written by falak init
    port: 8080 # EXPOSE 8080 in the starter Dockerfile
    build:
      mode: docker

  web:
    type: app
    root: apps/web
    runtime: node # detected: next 15.5.2 in package.json

