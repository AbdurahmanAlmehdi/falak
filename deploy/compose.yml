# Falak — production stack (single host). Installed by deploy/install.sh into /opt/falak and driven by
# falak-ctl; mirrors the topology proven in sim/compose.yml.
#
#   docker compose -p falak --env-file /opt/falak/.env -f /opt/falak/deploy/compose.yml [--profile observability] up -d
#
#   internet ──:80/:443──► edge (Caddy: ACME TLS, agent mTLS, security headers)
#                           ├─ FALAK_DOMAIN          ─► control-plane :8080 (panel: FrankenPHP worker mode)
#                           │                        ├► agent-api :8080 (/agent/*, /install/*, /api/internal/*)
#                           │                        ├► reverb :8080 (/app, /apps)
#                           │                        └► gateway :4318 (/otlp/*, observability profile)
#                           ├─ FALAK_AGENT_API_HOST  ─► agent-api (Fleet-CA server cert, client certs verified)
#                           ├─ FALAK_GRAFANA_HOST    ─► grafana :3000 (observability profile)
#                           └─ FALAK_REGISTRY_HOST   ─► registry :5000 (built-in image registry, token auth)
#   control-plane · agent-api · horizon · reverb · scheduler ── backend ──► postgres · valkey
#   builder ── public ──► edge (as FALAK_DOMAIN; artifact upload/download over the panel URL)
#   registry ── registry (internal) ◄── edge only: builders push and servers pull through FALAK_REGISTRY_HOST
#
# Panel vs agent-api: same image, separate FrankenPHP thread pools. Every agent (and builder) keeps a 30 s
# long-poll open, i.e. one busy PHP thread each; on the panel's pool they would queue every user request
# behind them. PHP threads: FALAK_WORKER_MODE / FALAK_PHP_WORKERS / FALAK_PHP_MAX_THREADS (panel) and
# FALAK_AGENT_API_THREADS (agent-api, >= servers + builders + 8); see docs/INSTALL.md "Performance".
#
# Networks: `edge` has a fixed subnet (FALAK_EDGE_SUBNET) and the edge a fixed address in it (FALAK_EDGE_IP, the .250
# host, set by falak-ctl ensure-host), because it is the only place the edge talks to the app from: the app trusts
# X-Forwarded-* / the client-cert fingerprint header only from that address (the whole subnet on an older .env).
#
# Memory limits are caps, not reservations; the measured idle budget per service is in docs/INSTALL.md
# ("Resource budget"). Core stack ≈ 0.6-0.8 GB idle (limits ≈ 4.3 GB), observability profile ≈ +0.6 GB.
#
# Secrets live only in /opt/falak/.env (generated by install.sh, mode 600) and the key-encryption key in
# /opt/falak/secrets/kek (falak-ctl kek init), which never goes in .env. Anything else Laravel reads
# (MAIL_*, FALAK_* tuning) can go in /opt/falak/custom.env.

name: falak

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

# Resource isolation (docs/INSTALL.md, "Sites on the control-plane machine"): with Docker's systemd cgroup driver every
# service but the builder runs in falakcp.slice (MemoryMin = FALAK_CP_RESERVE_MB, CPUWeight 1000; falak-ctl writes it)
# and is the last the kernel OOM killer picks. systemd creates a slice on demand, so a missing unit file never stops
# `up`. falak-ctl sets FALAK_CP_SLICE= (empty: Docker's default parent) with another cgroup driver.
x-caps: &caps
  cgroup_parent: ${FALAK_CP_SLICE-falakcp.slice}
  oom_score_adj: -900

# Least privilege for the services that need no Linux capabilities beyond the few each one adds (cap_add):
# no-new-privileges stops setuid binaries and file capabilities from raising a process's privileges. A root process
# changing its own ids by syscall (gosu, setpriv, the builder dropping to a build uid) is not affected.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-control-plane: &control-plane
  <<: *caps
  image: ${FALAK_IMAGE_PREFIX:?set FALAK_IMAGE_PREFIX}/falak-control-plane:${FALAK_VERSION:?set FALAK_VERSION}
  logging: *logging
  restart: unless-stopped
  init: true
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: ../custom.env
      required: false
  environment: &cp-env
    APP_NAME: Falak
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?set APP_KEY}
    APP_URL: ${FALAK_URL:?set FALAK_URL}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${FALAK_LOG_LEVEL:-warning}
    # The control-plane machine's reserved share (falakcp.slice): the panel subtracts it from that server's capacity.
    FALAK_CP_RESERVE_MB: ${FALAK_CP_RESERVE_MB:-1536}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: falak
    DB_USERNAME: falak
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    REDIS_CLIENT: phpredis
    REDIS_HOST: valkey
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    # Consoles stream through the relay service (wss://FALAK_DOMAIN/terminal/v1, edge).
    FALAK_TERMINAL_RELAY: "1"
    REVERB_APP_ID: ${REVERB_APP_ID:?set REVERB_APP_ID}
    REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET}
    # Server-side publishing goes straight to reverb; browsers connect to wss://FALAK_DOMAIN/app (edge).
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_PORT: "8080"
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-falak@localhost}
    MAIL_FROM_NAME: Falak
    # MAIL_MAILER=resend: Resend's API instead of SMTP (MAIL_FROM_ADDRESS on a domain verified in Resend).
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    # Managed multi-tenant install (strangers sign up): verified emails, no private webhooks or privileged compose.
    FALAK_MANAGED: ${FALAK_MANAGED:-false}
    # Fleet / agents
    FALAK_PANEL_URL: ${FALAK_URL}
    FALAK_AGENT_API_URL: ${FALAK_AGENT_API_URL:?set FALAK_AGENT_API_URL}
    FALAK_EDGE_AGENT_API_HOST: ${FALAK_AGENT_API_HOST:?set FALAK_AGENT_API_HOST}
    FALAK_AGENT_API_HOST_ALIASES: ${FALAK_AGENT_API_HOST_ALIASES:-}
    FALAK_CA_PATH: /falak/ca
    # Key-encryption key (docs/INSTALL.md, "Encryption keys"): /opt/falak/secrets/kek from the host, read-only.
    # aws-kms / vault-transit take their FALAK_KEK_AWS_* / FALAK_KEK_VAULT_* settings from custom.env.
    FALAK_KEK_PROVIDER: ${FALAK_KEK_PROVIDER:-local}
    FALAK_KEK_PATH: /opt/falak/secrets/kek
    FALAK_KEK_PREVIOUS_PATH: /opt/falak/secrets/kek.previous
    FALAK_DR_STATUS_PATH: /opt/falak/state/dr.json
    # The organization that operates the install (install.sh records the first admin's): it alone sees the control
    # plane's disaster recovery. Unset with several organizations: nobody does.
    FALAK_DR_ORGANIZATION: ${FALAK_DR_ORGANIZATION:-}
    # A bare address is a /32 to Symfony's IpUtils (TrustProxies, AuthenticateAgent).
    FALAK_AGENT_TRUSTED_PROXIES: ${FALAK_EDGE_IP:-${FALAK_EDGE_SUBNET:-10.213.77.0/24}}
    TRUSTED_PROXIES: ${FALAK_EDGE_IP:-${FALAK_EDGE_SUBNET:-10.213.77.0/24}}
    FALAK_AGENT_WAKE_DRIVER: redis
    FALAK_ACME_EMAIL: ${FALAK_ACME_EMAIL:-}
    FALAK_TEST_DOMAIN: ${FALAK_TEST_DOMAIN:-}
    FALAK_TEST_DOMAIN_TLS: ${FALAK_TEST_DOMAIN_TLS:-acme}
    FALAK_GENERATED_DOMAIN_SUFFIX: ${FALAK_GENERATED_DOMAIN_SUFFIX:-sslip.io}
    FALAK_DNS_RESOLVER: ${FALAK_DNS_RESOLVER:-doh}
    FALAK_DNS_DOH_URL: ${FALAK_DNS_DOH_URL:-https://cloudflare-dns.com/dns-query}
    # Sign-up: open | invite | closed (the first account can always register).
    FALAK_REGISTRATION: ${FALAK_REGISTRATION:-open}
    # Functions: runtime images are released with Falak under the same prefix (falak-fn-bun:<version>).
    FALAK_IMAGE_PREFIX: ${FALAK_IMAGE_PREFIX}
    # Builds: the builder container below polls with this token.
    FALAK_LOCAL_BUILDER_TOKEN: ${FALAK_BUILDER_TOKEN:?set FALAK_BUILDER_TOKEN}
    # Built-in image registry (docker builds push, servers pull): registry.<domain>. The operator credential from .env
    # (falak-ctl generates it) is for the control plane and falak-ctl only; agents and builders get short-lived
    # per-repository credentials, exchanged for registry tokens signed with secrets/registry-token.key.
    FALAK_REGISTRY_URL: ${FALAK_REGISTRY_URL:-registry.falak.local}
    FALAK_REGISTRY_USERNAME: ${FALAK_REGISTRY_USERNAME:-}
    FALAK_REGISTRY_PASSWORD: ${FALAK_REGISTRY_PASSWORD:-}
    FALAK_HORIZON_MAX_PROCESSES: ${FALAK_HORIZON_MAX_PROCESSES:-4}
    # PHP thread pools (deploy/control-plane/entrypoint.sh; empty = sized from the CPU count).
    FALAK_WORKER_MODE: ${FALAK_WORKER_MODE:-1}
    FALAK_PHP_WORKERS: ${FALAK_PHP_WORKERS:-}
    FALAK_PHP_THREADS: ${FALAK_PHP_THREADS:-}
    FALAK_PHP_MAX_THREADS: ${FALAK_PHP_MAX_THREADS:-}
    FALAK_AGENT_API_THREADS: ${FALAK_AGENT_API_THREADS:-128}
    # Telemetry (observability profile; empty values = not configured)
    FALAK_OTLP_ENDPOINT: ${FALAK_OTLP_ENDPOINT:-}
    FALAK_OTLP_TOKEN: ${FALAK_OTLP_TOKEN:-}
    FALAK_GRAFANA_URL: ${FALAK_GRAFANA_URL:-}
    FALAK_GRAFANA_PUBLIC_URL: ${FALAK_GRAFANA_PUBLIC_URL:-}
    FALAK_GRAFANA_TOKEN: ${FALAK_GRAFANA_TOKEN:-}
    FALAK_LOKI_URL: ${FALAK_LOKI_URL:-}
    FALAK_TEMPO_URL: ${FALAK_TEMPO_URL:-}
    FALAK_METRICS_QUERY_URL: ${FALAK_METRICS_QUERY_URL:-}
  volumes:
    - falak-ca:/falak/ca
    - app-storage:/app/storage
    # The KEK directory (falak-ctl kek init: dir 0711 root, kek 0400 owned by the container's www-data).
    - ../secrets:/opt/falak/secrets:ro
    # Disaster recovery status written by falak-ctl (state/dr.json: no secrets; the bucket keys and the DR
    # passphrase stay in /opt/falak/dr, which no container mounts).
    - ../state:/opt/falak/state:ro

# The panel asks the host for updates and the local server through state/host (request.json in, status.json + logs
# out; falak-host.path runs `falak-ctl host-run`, which accepts only its allowlist). Writable only here.
x-host-volumes: &host-volumes
  - falak-ca:/falak/ca
  - app-storage:/app/storage
  - ../secrets:/opt/falak/secrets:ro
  - ../state:/opt/falak/state:ro
  - ../state/host:/falak/host

services:
  postgres:
    <<: [*caps, *hardened]
    image: postgres:17.11
    logging: *logging
    restart: unless-stopped
    # The entrypoint (root) fixes the data directory's owner and mode, then gosu drops to postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    environment:
      POSTGRES_DB: falak
      POSTGRES_USER: falak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - log_min_duration_statement=2000
    shm_size: 256m
    stop_grace_period: 60s
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falak -d falak"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512m }

  valkey:
    <<: [*caps, *hardened]
    image: valkey/valkey:9.1.2-alpine
    logging: *logging
    restart: unless-stopped
    # Queues + cache + sessions: AOF (fsync every second) plus RDB snapshots; never evict (queued jobs).
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$REDISCLI_AUTH" --appendonly yes --appendfsync everysec --save 900 1 --save 300 100 --maxmemory 128mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits: { memory: 192m }

  # state/host for the panel's host requests (root:www-data 1770), also when an older falak-ctl ran the update and
  # never created it. Stays up idle instead of exiting: falak-ctl's health check (old versions included) fails on any
  # container that is not running, which would roll the update back.
  host-init:
    <<: *caps
    image: postgres:17.11   # already on the host (the database)
    logging: *logging
    restart: unless-stopped
    init: true
    user: "0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The group is the panel containers' www-data (FALAK_APP_UID, as falak-ctl uses it; 33 in the image).
    # Also hands Tempo's volume (written as root before Tempo ran as its own uid) to Tempo's 10001.
    cap_add: [CHOWN, FOWNER, DAC_READ_SEARCH]
    entrypoint: ["sh", "-c", "mkdir -p /state/host && chown 0:${FALAK_APP_UID:-33} /state/host && chmod 1770 /state/host && find /tempo \\! -user 10001 -exec chown 10001:10001 {} + && exec sleep infinity"]
    volumes:
      - ../state:/state
      - tempo-data:/tempo
    healthcheck:
      # 2 s: the panel services wait for it (start_interval would need Docker Engine 25+).
      test: ["CMD-SHELL", "test -k /state/host"]
      interval: 2s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 16m }

  control-plane:
    <<: *control-plane
    command: ["web"]
    environment:
      <<: *cp-env
      FALAK_MIGRATE: "1"
    volumes: *host-volumes
    networks: [edge, backend, observability]
    depends_on:
      host-init: { condition: service_healthy }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  # Agents, installer and builders (edge routes /agent/*, /install/*, /api/internal/* here): classic PHP
  # mode, thread pool autoscaled up to FALAK_AGENT_API_THREADS (~2-3 MB per waiting long-poll).
  agent-api:
    <<: *control-plane
    command: ["agent-api"]
    networks: [edge, backend, observability]
    depends_on:
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  horizon:
    <<: *control-plane
    command: ["horizon"]
    volumes: *host-volumes
    stop_grace_period: 90s
    networks: [backend, observability]
    depends_on:
      host-init: { condition: service_healthy }
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 512m }

  reverb:
    <<: *control-plane
    command: ["reverb"]
    networks: [edge, backend]
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 192m }

  # Terminal relay (Go, same image): pipes console bytes between agents and browsers/the CLI, so typing costs one
  # round trip instead of a command long-poll per keystroke. Holds no state worth keeping; needs only APP_KEY.
  relay:
    <<: *control-plane
    command: ["relay"]
    # Internet-facing through the edge: only what it needs, not the control plane's env (merging replaces the map).
    env_file: []
    environment:
      APP_KEY: ${APP_KEY:?set APP_KEY}
      # FALAK_URL is the panel's public origin; the relay defaults to restricting browser WebSocket connections to it.
      # Set FALAK_RELAY_ORIGINS to override (comma-separated patterns, or "*" to disable the check).
      FALAK_URL: ${FALAK_URL:?set FALAK_URL}
      GOMEMLIMIT: 48MiB
    volumes: []
    # edge: browsers, the CLI and agents; backend: the control plane revokes access (POST /internal/v1/..., never
    # routed by the edge).
    networks: [edge, backend]
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 64m }

  scheduler:
    <<: *control-plane
    command: ["scheduler"]
    volumes: *host-volumes
    networks: [backend, observability]
    depends_on:
      host-init: { condition: service_healthy }
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "falak-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 256m }

  edge:
    <<: [*caps, *hardened]
    image: ${FALAK_IMAGE_PREFIX}/falak-edge:${FALAK_VERSION}
    logging: *logging
    restart: unless-stopped
    init: true
    # Ports 80/443; reading the agent API key the control plane (www-data) wrote 0600 into falak-ca.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    environment:
      FALAK_DOMAIN: ${FALAK_DOMAIN:?set FALAK_DOMAIN}
      FALAK_AGENT_API_HOST: ${FALAK_AGENT_API_HOST}
      FALAK_AGENT_API_HOST_ALIASES: ${FALAK_AGENT_API_HOST_ALIASES:-}
      FALAK_DOMAIN_ALIASES: ${FALAK_DOMAIN_ALIASES:-}
      FALAK_URL: ${FALAK_URL}
      FALAK_GRAFANA_HOST: ${FALAK_GRAFANA_HOST:-}
      # The registry host (TLS here; the registry checks the bearer tokens the control plane signs).
      FALAK_REGISTRY_HOST: ${FALAK_REGISTRY_HOST:-}
      FALAK_REGISTRY_HOST_ALIASES: ${FALAK_REGISTRY_HOST_ALIASES:-}
      FALAK_TLS: ${FALAK_TLS:-acme}
      FALAK_ACME_EMAIL: ${FALAK_ACME_EMAIL:-}
      FALAK_ACME_CA: ${FALAK_ACME_CA:-}
      FALAK_HSTS: ${FALAK_HSTS:-max-age=31536000}
      FALAK_HTTP_PORT: ${FALAK_HTTP_PORT:-80}
      FALAK_HTTPS_PORT: ${FALAK_HTTPS_PORT:-443}
      FALAK_EDGE_CA_FILE: /falak/ca/ca.pem
      # Sites on the control-plane machine (falak-ctl local-server enable): hosts the edge does not serve go to the
      # local agent's edge on the edge network's gateway.
      FALAK_LOCAL_EDGE: ${FALAK_LOCAL_EDGE:-}
      FALAK_LOCAL_EDGE_UPSTREAM_HTTPS: ${FALAK_LOCAL_EDGE_UPSTREAM_HTTPS:-}
      FALAK_LOCAL_EDGE_UPSTREAM_HTTP: ${FALAK_LOCAL_EDGE_UPSTREAM_HTTP:-}
      FALAK_EDGE_PKI_OUT: /falak/edge-pki
      # Panel over Tailscale only (falak-ctl panel-access): browser paths only from these CIDRs. Unset or empty:
      # everyone (never pass it empty: Caddy would then match no client and refuse the panel to all).
      FALAK_PANEL_ALLOW: ${FALAK_PANEL_ALLOW:-0.0.0.0/0 ::/0}
    volumes:
      - falak-ca:/falak/ca:ro
      - edge-pki:/falak/edge-pki
      # Operator-owned extra sites (/opt/falak/edge/*.caddyfile, plus any files they serve); see docs/INSTALL.md.
      - ../edge:/etc/caddy/custom:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # Same port inside and out, so containers reach the edge at the public URL (see FALAK_URL).
      - "${FALAK_BIND:-0.0.0.0}:${FALAK_HTTP_PORT:-80}:${FALAK_HTTP_PORT:-80}"
      - "${FALAK_BIND:-0.0.0.0}:${FALAK_HTTPS_PORT:-443}:${FALAK_HTTPS_PORT:-443}"
      - "${FALAK_BIND:-0.0.0.0}:${FALAK_HTTPS_PORT:-443}:${FALAK_HTTPS_PORT:-443}/udp"
    networks:
      edge:
        # Empty (an .env from before ensure-host set it): an address from the pool, as before.
        ipv4_address: ${FALAK_EDGE_IP:-}
      observability: {}
      registry: {}
      public:
        # The builder (and anything else on `public`) reaches the panel/agents hosts without hairpin NAT.
        aliases: ["${FALAK_DOMAIN}", "${FALAK_AGENT_API_HOST}"]
    depends_on:
      control-plane: { condition: service_started }
      agent-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: { memory: 128m }

  # Shared builder of the control-plane host (native builds: PHP/Composer, Node, Bun). Capped so a build can't take the
  # panel down: memory, FALAK_BUILDER_CPUS (falak-ctl: cores - 1, min 1), pids, and killed before any panel service.
  # With a local server it runs in falak.slice next to the sites (FALAK_BUILDER_SLICE); otherwise Docker's default.
  builder:
    <<: *hardened
    image: ${FALAK_IMAGE_PREFIX}/falak-builder:${FALAK_VERSION}
    logging: *logging
    # Root installs dependencies and owns the build trees; SETUID/SETGID/KILL to run (and stop) build steps under other
    # uids. no-new-privileges still lets root change ids by syscall.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, SETUID, SETGID]
    cgroup_parent: ${FALAK_BUILDER_SLICE:-}
    oom_score_adj: 500
    restart: unless-stopped
    init: true
    # Root drops to a per-organization uid for build steps (setuid needs no new privileges; setuid binaries stay inert).
    security_opt: ["no-new-privileges:true"]
    command: ["serve"]
    environment:
      FALAK_URL: ${FALAK_URL}
      FALAK_BUILDER_TOKEN: ${FALAK_BUILDER_TOKEN}
      FALAK_BUILDER_NAME: control-plane
      # Disk guard floors in GiB (empty: the builder's defaults, 5 and 2).
      FALAK_BUILD_MIN_FREE_GB: ${FALAK_BUILD_MIN_FREE_GB:-}
      FALAK_BUILD_ABORT_FREE_GB: ${FALAK_BUILD_ABORT_FREE_GB:-}
      FALAK_TLS: ${FALAK_TLS:-acme}
    volumes:
      - builder-data:/var/lib/falak-builder
      - builder-cache:/root/.cache
      - edge-pki:/falak/edge-pki:ro
    networks: [public]
    depends_on:
      edge: { condition: service_healthy }
      agent-api: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1536m, cpus: "${FALAK_BUILDER_CPUS:-1}", pids: 4096 }

  # Built-in image registry (distribution): images of docker builds, pushed by builders and pulled by servers
  # through the edge (https://FALAK_REGISTRY_HOST). Only the edge can reach it. Token auth: clients log in at the
  # control plane's token server (the realm) and present a short-lived JWT signed with secrets/registry-token.key;
  # the registry verifies it with the certificate (falak-ctl creates both). Deletes are enabled for `falak-ctl registry gc`.
  registry:
    <<: [*caps, *hardened]
    image: registry:2.8.3
    logging: *logging
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # Behind the edge: Location headers relative, so redirects keep the public https host.
      REGISTRY_HTTP_RELATIVEURLS: "true"
      REGISTRY_LOG_LEVEL: warn
      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: ${FALAK_URL}/api/internal/registry/token
      REGISTRY_AUTH_TOKEN_SERVICE: falak-registry
      REGISTRY_AUTH_TOKEN_ISSUER: falak
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /etc/falak/registry-token.crt
      # Health on the debug listener: with token auth /v2/ answers 401. Loopback only, inside the container.
      REGISTRY_HTTP_DEBUG_ADDR: 127.0.0.1:5001
    volumes:
      - registry-data:/var/lib/registry
      - ../secrets/registry-token.crt:/etc/falak/registry-token.crt:ro
    networks: [registry]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5001/debug/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256m }

  # --- observability profile (configs from ../observability; VictoriaMetrics backend) ------------------
  gateway:
    <<: [*caps, *hardened]
    image: caddy:2.11.4-alpine
    read_only: true
    tmpfs: [/data, /config]
    # Stock Caddy carries the file capability cap_net_bind_service: without it in the bounding set the exec fails.
    cap_add: [NET_BIND_SERVICE]
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    volumes:
      - ../observability/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      FALAK_OTLP_TOKEN: ${FALAK_OTLP_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4318/ready/logs && wget -q -O /dev/null http://127.0.0.1:4318/ready/traces && wget -q -O /dev/null http://127.0.0.1:4318/ready/metrics"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 64m }

  loki:
    <<: [*caps, *hardened]
    image: grafana/loki:3.7.8
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      FALAK_LOGS_RETENTION: ${FALAK_LOGS_RETENTION:-360h}
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  tempo:
    <<: [*caps, *hardened]
    image: grafana/tempo:2.10.8
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    # The image's uid (10001); host-init hands it the volume.
    depends_on:
      host-init: { condition: service_healthy }
    command: ["-config.file=/etc/tempo/tempo.yaml", "-config.expand-env=true"]
    environment:
      FALAK_TRACES_RETENTION: ${FALAK_TRACES_RETENTION:-360h}
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  victoriametrics:
    <<: [*caps, *hardened]
    image: victoriametrics/victoria-metrics:v1.152.0
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=${FALAK_METRICS_RETENTION:-30d}
      - -httpListenAddr=:8428
      - -opentelemetry.usePrometheusNaming=true
      - -memory.allowedPercent=60
      - -search.latencyOffset=5s
      - -loggerLevel=WARN
    volumes:
      - vm-data:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 384m }

  grafana:
    <<: [*caps, *hardened]
    image: grafana/grafana:13.2.2
    profiles: [observability]
    restart: unless-stopped
    logging: *logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${FALAK_GRAFANA_PUBLIC_URL:-http://localhost:3000}
      GF_LOG_LEVEL: warn
      # Grafana 12+ downloads its Drilldown/Advisor/Pyroscope apps on first start (+~110 MB RAM, internet
      # access); Falak's dashboards and alert rules do not use them. FALAK_GRAFANA_PREINSTALL_DISABLED=false
      # restores the stock behaviour. Plugins already in the grafana-data volume keep loading.
      GF_PLUGINS_PREINSTALL_DISABLED: ${FALAK_GRAFANA_PREINSTALL_DISABLED:-true}
      FALAK_METRICS_QUERY_URL: http://gateway:9090/prometheus
      FALAK_METRICS_PROMETHEUS_TYPE: Prometheus
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards/falak:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    depends_on:
      loki: { condition: service_started }
      tempo: { condition: service_started }
    networks: [observability]
    deploy:
      resources:
        limits: { memory: 512m }

volumes:
  pg-data:
  valkey-data:
  app-storage:
  falak-ca:
  edge-pki:
  caddy-data:
  caddy-config:
  builder-data:
  builder-cache:
  registry-data:
  loki-data:
  tempo-data:
  vm-data:
  grafana-data:

networks:
  edge:
    ipam:
      config: [{ subnet: "${FALAK_EDGE_SUBNET:-10.213.77.0/24}" }]
  backend: {}
  public: {}
  observability: {}
  # Only the edge (TLS in front of the registry's token auth) is on this network.
  registry:
    internal: true
