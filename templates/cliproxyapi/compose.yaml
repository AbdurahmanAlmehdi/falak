# Management console: <url>/management.html (the image downloads the panel from GitHub on first visit).
# config.yaml is written once, on the first start, into the config volume; later edits from the console persist.
# OAuth logins (Claude, Codex, Antigravity…) redirect to http://localhost:<port>/callback, which can't reach a remote
# server: when the browser lands on that failed localhost page, copy its URL and paste it into the console's
# callback field. Codex can also log in with the device flow.
services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v8.0.32
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        umask 077
        if [ ! -s /CLIProxyAPI/config/config.yaml ]; then
          printf 'config-version: 8\nserver:\n  host: ""\n  port: 8317\nmanagement:\n  allow-remote: true\n  secret-key: ""\n  disable-control-panel: false\naccess:\n  api-keys:\n    - "%s"\noauth:\n  auth-dir: "/root/.cli-proxy-api"\n' "$$PROXY_API_KEY" > /CLIProxyAPI/config/config.yaml
        fi
        exec ./CLIProxyAPI --config /CLIProxyAPI/config/config.yaml
    expose: ["8317"]
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD}
      PROXY_API_KEY: ${PROXY_API_KEY}
      TZ: UTC
    volumes:
      - cliproxyapi-config:/CLIProxyAPI/config
      - cliproxyapi-auths:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cliproxyapi-config:
  cliproxyapi-auths:
