# Falak end-to-end simulation.
#
#   make up        (= docker compose -p falak-sim --env-file sim.env --profile victoriametrics up -d --build)
#
#   host ──https :8443──► edge (Caddy, internal CA TLS + agent mTLS) ──► control-plane (panel, FrankenPHP worker mode)
#                                                                      ├► agent-api (/agent/*, /install/*, /api/internal/*)
#                                                                      ├► reverb
#                                                                      └► relay (terminal relay, Go)
#   srv-app-1, srv-app-2, srv-db-1 (Ubuntu 24.04 + systemd) ── fleet network ──► edge as https://falak.test
#                                                          └─ observability network ──► gateway:4318 (OTLP)
#   control-plane, agent-api, horizon, reverb ── backend network ──► postgres, valkey
# control-plane and agent-api run the production runtime (deploy/control-plane: Caddyfile, entrypoint, php.ini):
# agents and the builder long-poll agent-api, which has its own PHP thread pool, so they never starve the panel.
#
# Caches (make up creates them; they survive `make reset`, `make clean-cache` / `make reset-all` wipe them):
#   sim-apt-cache (apt-cacher-ng)    HTTP apt proxy of the servers (Proxy-Auto-Detect)       volume falak-sim-cache-apt
#   sim-downloads (nginx)            runtime release mirror (FALAK_*_MIRROR) + ondrej PPA      volume falak-sim-cache-downloads
#   sim-hub-mirror (registry proxy)  Docker Hub registry-mirror for srv-app-2 + BuildKit     volume falak-sim-cache-hub
#   sim-ghcr-mirror (registry proxy) ghcr.io for srv-app-2 (via the edge, servers' /etc/hosts) volume falak-sim-cache-ghcr
#   sim-prefetch (crane)             warms both registry caches with the E2E's images in the background
#   builder-cache                    falak-builder composer/npm/bun/BuildKit caches           volume falak-sim-cache-builder
# The product code paths are unchanged: apt, runtime downloads (sha256-verified), docker pulls and builds all
# still run for real; only the bytes come from a local cache after the first run.
#
# Integration point: the Fleet module writes its CA certificate to $FALAK_CA_PATH/ca.pem
# (= /falak/ca/ca.pem on the shared `falak-ca` volume); the edge watches that file and uses it
# to verify agent client certificates.

name: falak-sim

include:
  - path: [../observability/compose.yml, ./observability.override.yml]
    env_file: ./sim.env

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-control-plane: &control-plane
  image: falak-sim/control-plane:dev
  logging: *logging
  restart: unless-stopped
  environment: &cp-env
    APP_NAME: Falak
    APP_ENV: local
    APP_DEBUG: "true"
    APP_KEY: ${APP_KEY}
    APP_URL: https://falak.test
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: falak
    DB_USERNAME: falak
    DB_PASSWORD: falak
    REDIS_CLIENT: phpredis
    REDIS_HOST: valkey
    REDIS_PORT: "6379"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    FALAK_TERMINAL_RELAY: "1"
    REVERB_APP_ID: ${REVERB_APP_ID}
    REVERB_APP_KEY: ${REVERB_APP_KEY}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET}
    # Server-side publishing goes straight to the reverb service on the backend network;
    # browsers use the public edge (VITE_* are build-time; unset in the sim image, so the UI polls).
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    REVERB_SERVER_PORT: "8080"
    # Fleet
    FALAK_LOCAL_BUILDER_TOKEN: ${FALAK_LOCAL_BUILDER_TOKEN}
    # The sim builder reaches a Docker daemon (host socket), so it also takes docker / compose builds, pushed to
    # the sim registry (plain HTTP on the fleet network; servers trust it as an insecure registry).
    FALAK_LOCAL_BUILDER_MODES: native,docker
    FALAK_REGISTRY_URL: sim-registry:5000
    FALAK_REGISTRY_NAMESPACE: falak
    # Hosted test domains <slug>.sites.falak.test, with Caddy's internal CA (no public ACME in the sim).
    FALAK_TEST_DOMAIN: sites.falak.test
    FALAK_TEST_DOMAIN_TLS: internal
    FALAK_CA_PATH: /falak/ca
    # Key-encryption key: generated by the web role into the storage volume on first start (`make reset` drops it
    # with the database). Production mounts /opt/falak/secrets/kek from the host instead.
    FALAK_KEK_PATH: /app/storage/falak/kek
    FALAK_KEK_PREVIOUS_PATH: /app/storage/falak/kek.previous
    FALAK_KEK_GENERATE: "1"
    FALAK_AGENT_TRUSTED_PROXIES: 10.77.10.0/24  # backend network: only the edge sets the fingerprint header
    TRUSTED_PROXIES: 10.77.10.0/24              # trust the edge's X-Forwarded-Proto/Host (https URLs, client IPs)
    FALAK_PANEL_URL: https://falak.test
    FALAK_AGENT_API_URL: https://agents.falak.test/agent/v1   # mTLS API; server cert from the Falak CA
    FALAK_EDGE_AGENT_API_HOST: agents.falak.test              # entrypoint issues that cert into /falak/ca
    FALAK_OTLP_ENDPOINT: http://gateway:4318
    FALAK_AGENT_BINARIES_PATH: /opt/falak/src/agent/bin
    FALAK_AGENT_SCHEMAS_PATH: /opt/falak/src/contracts/agent-protocol
    FALAK_TEMPLATES_PATH: /opt/falak/src/templates
    FALAK_AGENT_WAKE_DRIVER: redis
    # The sim's servers are custom servers on one fleet network: Redis instances may use their private IPv4s (off in
    # production, where custom servers' private addresses can be NATed or on different networks).
    FALAK_REDIS_CUSTOM_PRIVATE_NETWORK: "true"
    # Runtime release binaries through the sim's caching mirror (product feature, see docs/INSTALL.md).
    FALAK_FRANKENPHP_MIRROR: https://downloads.falak.test/github/php/frankenphp/releases/download
    FALAK_NODE_MIRROR: https://downloads.falak.test/nodejs
    FALAK_BUN_MIRROR: https://downloads.falak.test/github/oven-sh/bun/releases/download
    FALAK_DENO_MIRROR: https://downloads.falak.test/github/denoland/deno/releases/download
    # Telemetry module -> observability stack
    FALAK_GRAFANA_URL: http://grafana:3000
    FALAK_LOKI_URL: http://loki:3100
    FALAK_TEMPO_URL: http://tempo:3200
    FALAK_METRICS_QUERY_URL: http://gateway:9090/prometheus
  volumes:
    - falak-ca:/falak/ca
    - cp-storage:/app/storage
    - ..:/opt/falak/src:ro
  # fleet: the control plane (web + Horizon workers running health checks) reaches servers directly,
  # as it would over their public addresses in production.
  networks: [backend, observability, fleet]
  deploy:
    resources:
      limits: { memory: 512m }

x-server: &server
  image: falak-sim/server:dev
  build:
    context: .
    dockerfile: server.Dockerfile
  logging: *logging
  privileged: true          # systemd as PID 1 (cgroup delegation, mounts)
  cgroup: private
  tmpfs: [/run, /run/lock, /tmp]
  environment: &server-env
    SIM_AGENT_ARCH: ${SIM_AGENT_ARCH:-arm64}
    SIM_SSH_PUBKEY: ${SIM_SSH_PUBKEY:-}
    SIM_PANEL_URL: https://falak.test
    SIM_OTLP_ENDPOINT: http://gateway:4318
    SIM_SERVER_ROLE: app
    SIM_APT_PROXY: http://sim-apt-cache:3142   # empty: apt goes direct
  volumes:
    - ..:/opt/falak/src:ro                   # agent binary: /opt/falak/src/agent/bin/falak-agent-linux-$SIM_AGENT_ARCH
    - edge-pki:/etc/falak/edge-pki:ro        # edge TLS root CA (trusted at boot)
  networks: [fleet, observability]
  # Only on the servers: the ondrej/php PPA and GHCR resolve to the edge, which fronts pull-through caches of the
  # real upstreams (see the edge Caddyfile). Everything else (the caches themselves, BuildKit) resolves normally.
  extra_hosts:
    - "ppa.launchpadcontent.net=${SIM_EDGE_FLEET_IP:-10.77.20.250}"
    - "ghcr.io=${SIM_EDGE_FLEET_IP:-10.77.20.250}"
  depends_on:
    edge: { condition: service_healthy }
    sim-apt-cache: { condition: service_healthy }
    sim-downloads: { condition: service_healthy }
    sim-hub-mirror: { condition: service_healthy }
    sim-ghcr-mirror: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "systemctl", "is-system-running"]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 30s
    start_interval: 1s
  deploy:
    resources:
      limits: { memory: 512m }

services:
  postgres:
    image: postgres:17.11
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: falak
      POSTGRES_USER: falak
      POSTGRES_PASSWORD: falak
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falak -d falak"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 256m }

  valkey:
    image: valkey/valkey:9.1.2-alpine
    logging: *logging
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 128m }

  control-plane:
    <<: *control-plane
    build:
      context: ../control-plane
      dockerfile: ../sim/control-plane.Dockerfile
      additional_contexts:
        deploy: ../deploy/control-plane
    command: ["web"]
    environment:
      <<: *cp-env
      FALAK_MIGRATE: "1"
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
      start_interval: 1s

  # Agents, installer and builders (the edge routes /agent/*, /install/*, /api/internal/* here).
  agent-api:
    <<: *control-plane
    command: ["agent-api"]
    depends_on:
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
      start_interval: 1s

  horizon:
    <<: *control-plane
    command: ["horizon"]
    depends_on:
      control-plane: { condition: service_healthy }   # migrations have run
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s
      start_interval: 2s

  reverb:
    <<: *control-plane
    command: ["reverb"]
    depends_on:
      control-plane: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
      start_interval: 1s

  # Terminal relay (docs/plans/CONSOLE.md); production runs it from the control-plane image (role `relay`).
  relay:
    image: falak-sim/relay:dev
    build:
      context: ../agent
      dockerfile: ../sim/relay.Dockerfile
    logging: *logging
    restart: unless-stopped
    init: true
    environment:
      APP_KEY: ${APP_KEY}
      GOMEMLIMIT: 48MiB
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_interval: 1s

  edge:
    image: falak-sim/edge:dev
    build: ./edge
    logging: *logging
    restart: unless-stopped
    init: true
    environment:
      FALAK_EDGE_CA_FILE: /falak/ca/ca.pem
      FALAK_AGENT_API_HOST: agents.falak.test
      FALAK_EDGE_PKI_OUT: /falak/edge-pki
    volumes:
      - falak-ca:/falak/ca:ro
      - edge-pki:/falak/edge-pki
      - edge-data:/data
    ports:
      - "127.0.0.1:${SIM_EDGE_HTTPS_PORT:-8443}:443"
    networks:
      backend: {}
      fleet:
        aliases: [falak.test, agents.falak.test, downloads.falak.test]
        ipv4_address: ${SIM_EDGE_FLEET_IP:-10.77.20.250}   # static: the servers' extra_hosts point here
    healthcheck:
      # Caddy is serving TLS and has published its root CA for the servers.
      test: ["CMD-SHELL", "test -s /falak/edge-pki/root.crt && curl -fsS -o /dev/null http://localhost:2019/config/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { memory: 128m }

  srv-app-1:
    <<: *server
    hostname: srv-app-1
    environment:
      <<: *server-env
      SIM_SERVER_ROLE: app
  srv-app-2:
    <<: *server
    hostname: srv-app-2
    environment:
      <<: *server-env
      SIM_SERVER_ROLE: app
    # Docker Compose sites run here (nested dockerd): /var/lib/docker must not be on the container's overlayfs.
    volumes:
      - ..:/opt/falak/src:ro
      - edge-pki:/etc/falak/edge-pki:ro
      - srv-app-2-docker:/var/lib/docker
      - srv-app-2-containerd:/var/lib/containerd
    deploy:
      resources:
        limits: { memory: 2560m }
  srv-db-1:
    <<: *server
    hostname: srv-db-1
    environment:
      <<: *server-env
      SIM_SERVER_ROLE: db

  # The control-plane host's shared builder (FALAK_LOCAL_BUILDER_TOKEN), polling the internal builder API.
  # Native builds run in the container; docker/compose builds use BuildKit through the host Docker socket
  # (a buildx docker-container builder attached to the fleet network, pushing to sim-registry).
  builder:
    build: ./builder
    environment:
      FALAK_URL: https://falak.test
      FALAK_BUILDER_TOKEN: ${FALAK_LOCAL_BUILDER_TOKEN}
      FALAK_BUILDER_NAME: control-plane
      SIM_BUILDKIT_NETWORK: falak-sim_fleet
      SIM_REGISTRY: sim-registry:5000
      SIM_HUB_MIRROR: sim-hub-mirror:5000
      # composer / npm / bun / BuildKit caches on the persistent builder-cache volume (default is under /tmp).
      FALAK_BUILDER_CACHE_DIR: /root/.cache/falak-builder
    volumes:
      - ../agent/bin/falak-builder-linux-${SIM_AGENT_ARCH:-arm64}:/opt/falak/falak-builder:ro
      - edge-pki:/falak/edge-pki:ro
      - builder-cache:/root/.cache
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      edge: { condition: service_healthy }
      agent-api: { condition: service_healthy }
      sim-git: { condition: service_healthy }
      sim-hub-mirror: { condition: service_healthy }
    networks: [fleet]
    logging: *logging

  # Built-in registry for docker / compose builds (distribution, plain HTTP; sim only).
  sim-registry:
    image: registry:2.8.3
    logging: *logging
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks: [fleet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s

  # ---- persistent caches (see the header) -------------------------------------------------------------
  sim-apt-cache:
    image: falak-sim/apt-cache:dev
    build:
      context: ./caches
      dockerfile: apt-cache.Dockerfile
    logging: *logging
    restart: unless-stopped
    volumes:
      - cache-apt:/var/cache/apt-cacher-ng
    networks: [fleet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3142/acng-report.html"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  sim-downloads:
    image: nginx:1.31.6-alpine
    logging: *logging
    restart: unless-stopped
    # The cache directory is a fresh named volume (root-owned): hand it to the nginx workers first.
    command: ["sh", "-c", "mkdir -p /var/cache/nginx/downloads && chown nginx:nginx /var/cache/nginx/downloads && exec nginx -g 'daemon off;'"]
    volumes:
      - ./caches/downloads.conf:/etc/nginx/conf.d/default.conf:ro
      - cache-downloads:/var/cache/nginx/downloads
    networks: [fleet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  sim-hub-mirror:
    image: registry:2.8.3
    logging: *logging
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://registry-1.docker.io
    volumes:
      - cache-hub:/var/lib/registry
    networks: [fleet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  sim-ghcr-mirror:
    image: registry:2.8.3
    logging: *logging
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: https://ghcr.io
    volumes:
      - cache-ghcr:/var/lib/registry
    networks: [fleet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # Cache warmer: pulls the compose fixture and template images through sim-hub-mirror / sim-ghcr-mirror in the
  # background after `make up` (the pull-through registry fetches an uncached blob upstream twice, so a cold pull
  # inside a deployment is ~2x slower than a direct one). The servers still pull everything themselves.
  sim-prefetch:
    image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    entrypoint: ["/busybox/sh", "/prefetch.sh"]
    logging: *logging
    restart: "no"
    environment:
      SIM_PREFETCH_TEMPLATES: uptime-kuma umami   # the templates e2e-deploy.sh deploys
      SIM_PLATFORM: linux/${SIM_AGENT_ARCH:-arm64}
    volumes:
      - ./caches/prefetch.sh:/prefetch.sh:ro
      - ../templates:/templates:ro
      - ./fixtures:/fixtures:ro
    depends_on:
      sim-hub-mirror: { condition: service_healthy }
      sim-ghcr-mirror: { condition: service_healthy }
    networks: [fleet]

  # Read-only git server with the demo apps (git://sim-git/<app>.git), used by builders in E2E.
  sim-git:
    build: ./git
    volumes:
      - ./fixtures:/fixtures:ro
      - ../packages:/packages:ro
    networks: [backend, fleet]
    logging: *logging
    healthcheck:
      test: ["CMD", "test", "-f", "/srv/git/.seeded"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s

volumes:
  # Caches: external, so `docker compose down -v` (make reset) keeps them. Created by `make up`.
  cache-apt: { name: falak-sim-cache-apt, external: true }
  cache-downloads: { name: falak-sim-cache-downloads, external: true }
  cache-hub: { name: falak-sim-cache-hub, external: true }
  cache-ghcr: { name: falak-sim-cache-ghcr, external: true }
  builder-cache: { name: falak-sim-cache-builder, external: true }
  pg-data:
  valkey-data:
  cp-storage:
  falak-ca:
  edge-pki:
  edge-data:
  registry-data:
  srv-app-2-docker:
  srv-app-2-containerd:

networks:
  backend:
    ipam:
      config: [{ subnet: 10.77.10.0/24 }]
  fleet:
    # The "private network" between managed servers (and the edge they dial out to). Dynamic addresses come from
    # the lower half, so the edge's static address can never be taken.
    ipam:
      config: [{ subnet: 10.77.20.0/24, ip_range: 10.77.20.0/25 }]
